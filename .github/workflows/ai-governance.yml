name: AI Nutrition Label Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-ai-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Centralized AI Governance Container
        id: validator
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            -e GITHUB_BASE_REF="${{ github.base_ref }}" \
            -e PR_LABELS_JSON='${{ toJson(github.event.pull_request.labels.*.name) }}' \
            ghcr.io/subhajitsengupta04/ai-governance-gatekeeper:v1

      - name: Post or Update PR Governance Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_comment.md')) return;
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            const marker = '<!-- ai-nutrition-label-bot -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Enforce Gatekeeper Outcome
        if: steps.validator.outcome == 'failure'
        run: exit 1